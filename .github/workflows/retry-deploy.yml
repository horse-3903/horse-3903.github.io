name: Retry failed deploy

# A Pages deploy sometimes fails because the uploaded artifact is not visible yet, and re-running the same run
# then fails with a duplicate artifact. A fresh run works, so start one. Only a push-triggered failure is
# retried, so a failed retry does not loop.
on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait, then start a new deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 30
          gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
